[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-cbom"
version = "0.1.0"
description = "CycloneDX 1.5 CBOM metadata enrichment engine injecting quantum-safe classifications and CNSA 2.0 compliance properties."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["cbom", "cyclonedx", "sbom", "cnsa", "post-quantum", "pqc", "enricher", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "cyclonedx-python-lib>=11.12.0,<12.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
pqblocks-cbom = "pqblocks_cbom.__main__:main"

[project.urls]
Homepage = "https://github.com/PQBlocks/cbom-enricher"
Documentation = "https://github.com/PQBlocks/cbom-enricher#readme"
Source = "https://github.com/PQBlocks/cbom-enricher"
Changelog = "https://github.com/PQBlocks/cbom-enricher/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/cbom-enricher/issues"
Security = "https://github.com/PQBlocks/cbom-enricher/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
